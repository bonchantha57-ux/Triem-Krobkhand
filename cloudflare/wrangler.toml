name = "triem-krobkhand-api"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cloudflare D1 Database Binding
# Create DB with: npx wrangler d1 create triem-krobkhand-db
# Replace database_id below with the ID generated by Cloudflare
[[d1_databases]]
binding = "DB"
database_name = "triem-krobkhand-db"
database_id = "1055a5ca-5bb3-47cd-b911-edebd8906783"

[vars]
# Optional API Secret Key to protect Admin POST/DELETE operations
API_SECRET = ""
